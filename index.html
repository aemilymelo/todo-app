<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Lista de Tarefas (PWA)</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

    </head>
<body class="bg-light">

    <div id="app" class="container mt-5">
        
        <h1 class="text-center mb-4">Organizador de Tarefas</h1>
        
        <div class="input-group mb-3">
            <input type="text" id="inputNovaTarefa" class="form-control" placeholder="Digite uma nova tarefa..." aria-label="Nova Tarefa">
            <button class="btn btn-primary" type="button" id="btnAdicionar">Adicionar</button>
        </div>

        <ul id="listaDeTarefas" class="list-group">
            <li class="list-group-item text-center text-muted">Nenhuma tarefa encontrada. Adicione uma!</li>
        </ul>

        <div class="d-grid gap-2 mt-3">
            <button class="btn btn-outline-danger btn-sm" id="btnLimparTudo">Limpar Tudo</button>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="script.js"></script>
</body>
</html>
